{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

        }

            overflow: hidden;
            margin: 0;
            padding: 0;
        } */

</head>
<body>

</html>
