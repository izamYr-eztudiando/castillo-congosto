{% extends "base2.html" %}
{% load static %}
{% block head %}
<link rel="stylesheet" href="{% static 'css/autor.css' %}">
<title>{% block title %}El creador de esta hermosura{% endblock %}</title>
{% endblock %}
{% block content %}
<div class="autor">
    <div class="autor-container">
        <div class="datos-personales">
            <h2>Creado por</h2>
            <button id="mostrar-autor">Mostrar autor</button>
            <div id="info-autor" class="oculto">
                <div class="image-crossfade" id="crossfade-box">
                    <img src="{% static 'images/autor.png' %}" class="img-fade img-uno" alt="Foto anonima">
                    <img src="{% static 'images/Yo.png' %}" class="img-fade img-dos" alt="Foto del autor">
                </div>
                <div class="nombre-crossfade" id="crossfade-nombre">
                    <p class="nombre" id="nombre">AYsamir</p>
                </div>    
                <div class="estudios" id="mostrar-estudios">
                    <h2>Licenciado en</h2>
                    <p class="estudio" id="estudio">Llegar tarde</p>
                </div>
            </div>
        </div>
    </div>
</div>
<script src="{% static 'js/autor.js' %}"></script>
{% endblock %}
