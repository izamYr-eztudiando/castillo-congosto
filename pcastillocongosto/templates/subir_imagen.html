{% load static %}
{% block head %}
<title>Subir Imagen</title>
<link rel="stylesheet" href="{% static 'css/subir_imagen.css' %}">
{% endblock %}

{% block content %}
<div class="contenedor-subir">
    <h1 class="titulo-subir">📤 Subir nueva imagen</h1>

    <form method="post" enctype="multipart/form-data" class="formulario-subir">
        {% csrf_token %}
        <div class="campo-formulario">
            <label for="titulo">Título</label>
            <input type="text" name="titulo" placeholder="Ej: Boda de Ana y Luis" required>
        </div>

        <div class="campo-formulario">
            <label for="descripcion">Descripción</label>
            <textarea name="descripcion" rows="4" placeholder="Breve descripción de la imagen..." required></textarea>
        </div>

        <div class="campo-formulario">
            <label for="imagen">Archivo de imagen</label>
            <input type="file" name="imagen" id="imagen" required>
        </div>

        <div class="botones-formulario">
            <button type="submit" class="btn-publicar">📸 Publicar</button>
            <a href="{% url 'lista_imagenes' %}" class="btn-volver">⬅ Volver</a>
        </div>
    </form>
</div>
{% endblock %}
